{% extends 'base.html' %}{% block heading %}Dados da locadora{% endblock %}{% block subheading %}Cadastro empresarial e identidade visual deste tenant.{% endblock %}{% block content %}<section class="card"><form method="post" enctype="multipart/form-data" class="form-grid"><h2 class="wide">Dados empresariais</h2><label>Razão social<input name="razao_social" value="{{tenant.razao_social or ''}}"></label><label>Nome fantasia<input name="nome_fantasia" value="{{tenant.nome_fantasia or tenant.nome or ''}}"></label><label>CNPJ<input name="cnpj" value="{{tenant.cnpj or ''}}"></label><label>Inscrição estadual<input name="inscricao_estadual" value="{{tenant.inscricao_estadual or ''}}"></label><label>Inscrição municipal<input name="inscricao_municipal" value="{{tenant.inscricao_municipal or ''}}"></label><label>Responsável legal<input name="responsavel_legal" value="{{tenant.responsavel_legal or ''}}"></label><label>Telefone<input name="telefone" value="{{tenant.telefone or ''}}"></label><label>E-mail<input name="email" value="{{tenant.email or ''}}"></label><h2 class="wide">Endereço</h2><label>Logradouro<input name="logradouro" value="{{tenant.logradouro or ''}}"></label><label>Número<input name="numero_endereco" value="{{tenant.numero_endereco or ''}}"></label><label>Complemento<input name="complemento" value="{{tenant.complemento or ''}}"></label><label>Bairro<input name="bairro" value="{{tenant.bairro or ''}}"></label><label>Cidade<input name="cidade" value="{{tenant.cidade or ''}}"></label><label>UF<input name="uf" maxlength="2" value="{{tenant.uf or ''}}"></label><label>CEP<input name="cep" value="{{tenant.cep or ''}}"></label><h2 class="wide">Personalização</h2><label>Logo<input type="file" name="logo" accept="image/png,image/jpeg,image/webp"></label><label>Favicon<input type="file" name="favicon" accept="image/png,image/x-icon"></label><label>Cor principal<input type="color" name="cor_primaria" value="{{tenant.cor_primaria or '#173B57'}}"></label><label>Cor secundária<input type="color" name="cor_secundaria" value="{{tenant.cor_secundaria or '#24638F'}}"></label>{% if tenant.logo_key %}<div class="wide"><strong>Logo atual</strong><br><img src="{{url_for('arquivo_identidade_locadora',tipo='logo')}}" alt="Logo" style="max-width:220px;max-height:100px;margin-top:8px"></div>{% endif %}<div class="wide"><button>Salvar dados da locadora</button></div></form></section>{% endblock %}
