<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow">
 <title>Sistema em manutenção · Frota Fácil</title>
 <style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f1f5f9;color:#0f172a;font-family:Arial,sans-serif}.box{width:min(560px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:30px;box-shadow:0 18px 50px rgba(15,23,42,.09);text-align:center}.icon{width:72px;height:72px;border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;background:#fff7ed;font-size:36px}.brand{font-size:14px;font-weight:800;letter-spacing:.04em;color:#475569;margin-bottom:8px}.box h1{font-size:27px;margin:6px 0 12px}.msg{font-size:17px;line-height:1.55;color:#475569;margin:0 auto 16px;max-width:470px}.forecast{margin:18px 0;padding:13px 16px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:14px}.hint{font-size:13px;color:#64748b;margin:14px 0 22px}.btn{appearance:none;border:0;border-radius:11px;background:#0f172a;color:#fff;font-weight:800;font-size:15px;padding:13px 18px;cursor:pointer;width:100%}.tech{margin-top:22px;font-size:12px;color:#94a3b8}@media(max-width:540px){body{padding:16px}.box{padding:24px 18px;border-radius:16px}.box h1{font-size:23px}.msg{font-size:16px}}
 </style>
</head>
<body>
 <main class="box" role="main">
  <div class="icon" aria-hidden="true">🛠️</div>
  <div class="brand">FROTA FÁCIL</div>
  <h1>Sistema em manutenção</h1>
  <p class="msg">{{message}}</p>
  {% if expected_return %}<div class="forecast"><strong>Previsão de retorno:</strong> {{expected_return}}</div>{% endif %}
  <p class="hint">Se você estava realizando uma vistoria, enviando KM ou comprovante, retorne por este mesmo link após a atualização.</p>
  <button class="btn" type="button" onclick="location.reload()">Tentar novamente</button>
  <div class="tech">Tecnologia Frota Fácil</div>
 </main>
</body>
</html>
