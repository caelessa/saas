{% extends 'base.html' %}{% block heading %}Editar investidor{% endblock %}{% block subheading %}Atualize os dados mantendo os veículos e históricos vinculados.{% endblock %}{% block content %}<section class="card"><form method="post" class="form-grid"><label>Nome<input name="nome" value="{{x.nome or ''}}" required></label><label>CPF/CNPJ<input name="cpf_cnpj" value="{{x.cpf_cnpj or ''}}"></label><label>Telefone<input name="telefone" value="{{x.telefone or ''}}"></label><label>E-mail<input name="email" value="{{x.email or ''}}"></label><label>Regra<select name="regra_repasse">{% for op in ['Valor fixo','Percentual da receita','Percentual do lucro','Mínimo garantido'] %}<option {% if x.regra_repasse==op %}selected{% endif %}>{{op}}</option>{% endfor %}</select></label><label class="wide">Observações<textarea name="observacoes">{{x.observacoes or ''}}</textarea></label><div class="wide"><button>Salvar alterações</button> <a class="button secondary" href="{{url_for('investidores')}}">Cancelar</a></div></form></section>{% endblock %}
