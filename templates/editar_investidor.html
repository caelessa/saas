{% extends 'base.html' %}{% block heading %}Editar proprietário{% endblock %}{% block subheading %}Atualize os dados cadastrais sem alterar o histórico financeiro dos veículos.{% endblock %}{% block content %}<section class="card"><form method="post" class="form-grid"><label>Nome<input name="nome" value="{{x.nome or ''}}" required></label><label>CPF/CNPJ<input name="cpf_cnpj" value="{{x.cpf_cnpj or ''}}"></label><label>Telefone<input name="telefone" value="{{x.telefone or ''}}"></label><label>E-mail<input name="email" value="{{x.email or ''}}"></label><label class="wide">Observações<textarea name="observacoes">{{x.observacoes or ''}}</textarea></label><div class="wide"><button>Salvar alterações</button> <a class="button secondary" href="{{url_for('proprietario_financeiro',id=x.id)}}">Valores e veículos</a></div></form></section>{% endblock %}
